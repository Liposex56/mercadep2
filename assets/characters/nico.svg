<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="t d">
  <title id="t">Nico</title>
  <desc id="d">Personaje con lápiz en la oreja y una insignia de lista de chequeo, frente a líneas de un cuestionario (diseño del cuestionario).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd3e6"/>
      <stop offset="1" stop-color="#fff0f6"/>
    </linearGradient>
    <clipPath id="c"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="200" height="200" fill="url(#bg)"/>
    <!-- lineas de cuestionario de fondo -->
    <g stroke="#e79dbb" stroke-width="5" stroke-linecap="round" opacity=".6">
      <line x1="14" y1="46" x2="60" y2="46"/><line x1="14" y1="60" x2="46" y2="60"/>
      <line x1="140" y1="150" x2="186" y2="150"/><line x1="154" y1="164" x2="186" y2="164"/>
    </g>
    <g fill="#d74886" opacity=".75">
      <path d="M18 42 l4 4 l7 -8" stroke="#d74886" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M146 146 l4 4 l7 -8" stroke="#d74886" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- camisa con cuello -->
    <path d="M18 200 C22 160 58 142 100 142 C142 142 178 160 182 200 Z" fill="#a83366"/>
    <path d="M84 142 L100 168 L116 142 Z" fill="#8a2a55"/>
    <path d="M100 168 L100 200" stroke="#8a2a55" stroke-width="3"/>
        <!-- cabello (detrás) -->
    <circle cx="100" cy="68" r="44" fill="#1c1526"/>
    <!-- cuello y cabeza -->
    <rect x="88" y="118" width="24" height="26" rx="8" fill="#b57e58"/>
    <circle cx="62" cy="92" r="8" fill="#c58f66"/>
    <circle cx="138" cy="92" r="8" fill="#c58f66"/>
    <ellipse cx="100" cy="90" rx="37" ry="40" fill="#cf9770"/>
    <!-- mechón peinado de lado -->
    <path d="M70 58 C82 50 94 49 104 54" stroke="#1c1526" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- lapiz en la oreja -->
    <g transform="rotate(18 138 88)">
      <rect x="134" y="58" width="8" height="40" rx="2" fill="#ffd166"/>
      <path d="M134 58 L142 58 L138 48 Z" fill="#e0a24a"/>
      <rect x="134" y="92" width="8" height="6" fill="#4b3a2a"/>
    </g>
    <!-- rostro -->
    <path d="M78 82 Q86 78 94 82" stroke="#1c1526" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M106 82 Q114 78 122 82" stroke="#1c1526" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="86" cy="94" r="4.2" fill="#140f1c"/><circle cx="114" cy="94" r="4.2" fill="#140f1c"/>
    <circle cx="87.4" cy="92.6" r="1.3" fill="#fff"/><circle cx="115.4" cy="92.6" r="1.3" fill="#fff"/>
    <path d="M100 96 Q96 106 101 107" stroke="#a5704b" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M87 111 Q100 121 113 111" stroke="#7b2f3a" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <circle cx="76" cy="107" r="6" fill="#d74886" opacity=".25"/><circle cx="124" cy="107" r="6" fill="#d74886" opacity=".25"/>
    <!-- insignia de lista de chequeo -->
    <g transform="translate(100 160)">
      <rect x="-13" y="-11" width="26" height="22" rx="4" fill="#fff" stroke="#a83366" stroke-width="2"/>
      <path d="M-8 -3 L-4 1 L5 -8" stroke="#1f8f86" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-8" y1="5" x2="7" y2="5" stroke="#a83366" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
