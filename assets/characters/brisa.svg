<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="t d">
  <title id="t">Brisa</title>
  <desc id="d">Personaje con cabello largo ondulado y una flor, con hojas de selva al fondo (región Pacífica).</desc>
  <defs>
