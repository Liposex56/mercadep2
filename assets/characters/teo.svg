<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="t d">
  <title id="t">Teo</title>
  <desc id="d">Personaje con audífonos de entrevistador y tableta al cuello, frente a una ruta punteada con un marcador (trabajo de campo).</desc>
